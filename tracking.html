<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CUFFI CREATES — Auftragsfortschritt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{--bg:#f4f6f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--radius:18px}
    *{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",sans-serif}body{background:var(--bg);color:var(--text)}button{font:inherit}.page{max-width:1250px;margin:auto;padding:24px}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:65px;height:65px;object-fit:contain}.brand h1{font-size:19px;font-weight:800}.brand p{font-size:11px;color:var(--muted)}.live{background:#dcfce7;color:#166534;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 7px 28px rgba(15,23,42,.06);margin-bottom:18px}.loading,.error{min-height:55vh;display:grid;place-items:center;text-align:center}.error h2{margin-bottom:8px}.error p{color:var(--muted)}
    .order-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;color:var(--muted)}.invoice{font-size:27px;font-weight:800}.status{padding:9px 13px;border-radius:9px;font-size:12px;font-weight:800;text-transform:uppercase}.status.RECEIVED{background:#f1f5f9;color:#334155}.status.DESIGN{background:#f3e8ff;color:#6b21a8}.status.TUFTING{background:#dbeafe;color:#1e40af}.status.CARVING{background:#fef3c7;color:#92400e}.status.FERTIG{background:#dcfce7;color:#166534}.status.SHIPPED{background:#e0e7ff;color:#3730a3}
    .overview{display:grid;grid-template-columns:1.45fr 1.35fr .65fr;gap:24px;align-items:center}.product-img{width:100%;height:260px;object-fit:cover;border-radius:15px;border:1px solid var(--border);background:#f8fafc}.details{display:grid;grid-template-columns:auto 1fr;gap:13px 20px;font-size:14px}.details strong{color:#334155}.price-good{color:var(--green);font-weight:800}.price-open{color:var(--red);font-weight:800}.side-actions{display:grid;gap:10px;justify-items:stretch}.qr-placeholder{width:150px;height:150px;background:#f8fafc;border:1px dashed var(--border);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:11px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}.btn-whatsapp{background:#22c55e;color:#fff}.btn-print{background:#f1f5f9;color:#334155}
    .section-title{font-size:15px;font-weight:800;margin-bottom:18px}.section-title span{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.step{text-align:center;position:relative}.step:before{content:"";position:absolute;top:23px;left:-50%;width:100%;height:4px;background:#cbd5e1}.step:first-child:before{display:none}.step.done:before,.step.current:before{background:#22c55e}.bubble{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#e2e8f0;color:#64748b;margin:0 auto 8px;position:relative;z-index:1;font-size:18px}.step.done .bubble{background:#22c55e;color:#fff}.step.current .bubble{background:#2563eb;color:#fff}.step-name{font-size:11px;font-weight:800}.step-date{font-size:9px;color:var(--muted);margin-top:4px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.photo{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#fff;cursor:pointer}.photo img{width:100%;height:170px;object-fit:cover}.photo-info{padding:10px}.photo-info strong{font-size:11px}.photo-info p{font-size:9px;color:var(--muted);margin-top:4px}.empty{border:1px dashed var(--border);background:#f8fafc;border-radius:12px;padding:25px;text-align:center;color:var(--muted)}.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;padding:5px 4px 25px;gap:15px}.footer a{color:#16a34a;font-weight:800;text-decoration:none}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.86);display:none;place-items:center;padding:20px;z-index:999}.modal.show{display:grid}.modal-card{background:#fff;padding:14px;border-radius:16px;width:min(1050px,100%);position:relative}.modal-card img{width:100%;max-height:80vh;object-fit:contain;border-radius:10px}.close{position:absolute;right:20px;top:20px;width:38px;height:38px;border:0;border-radius:50%;background:#0f172a;color:#fff;cursor:pointer}
    @media(max-width:900px){.overview{grid-template-columns:1fr 1fr}.side-actions{grid-column:1/-1;grid-template-columns:1fr 1fr}.qr-placeholder{display:none}.steps{overflow:auto;grid-template-columns:repeat(6,115px)}}@media(max-width:650px){.page{padding:12px}.card{padding:16px}.brand img{width:50px;height:50px}.overview{grid-template-columns:1fr}.product-img{height:230px}.side-actions{grid-template-columns:1fr}.details{font-size:12px}.order-head{align-items:center}.invoice{font-size:22px}.footer{display:block;text-align:center}.footer div+div{margin-top:8px}}
    @media print{body{background:#fff}.page{max-width:none;padding:0}.brandbar,.btn,.live{display:none!important}.card{box-shadow:none;border-color:#ddd;break-inside:avoid}.footer{padding-bottom:0}}
  </style>
</head>
<body>
  <main class="page">
    <div class="brandbar"><div class="brand"><img src="logo.png" alt="CUFFI CREATES"><div><h1>CUFFI CREATES</h1><p>Tufting & Handmade Rugs</p></div></div><span class="live"><i class="fa-solid fa-arrows-rotate"></i> Automatische Aktualisierung</span></div>
    <section id="loading" class="card loading"><div><i class="fa-solid fa-spinner fa-spin" style="font-size:30px;color:#2563eb"></i><p style="margin-top:12px;color:#64748b">Bestellung wird geladen …</p></div></section>
    <section id="error" class="card error" style="display:none"><div><h2>Bestellung nicht gefunden</h2><p>Der Tracking-Link ist ungültig oder die Bestellung ist nicht mehr verfügbar.</p></div></section>
    <div id="content" style="display:none"></div>
  </main>
  <div id="modal" class="modal"><div class="modal-card"><button id="close" class="close"><i class="fa-solid fa-xmark"></i></button><img id="modalImg" alt="Fortschrittsfoto"></div></div>

  <script>
  "use strict";
  const CFG=window.CUFFI_CONFIG||{};
  const STAGES=[
    {key:"RECEIVED",label:"Auftrag erhalten",icon:"fa-inbox"},
    {key:"DESIGN",label:"Design",icon:"fa-pen-ruler"},
    {key:"TUFTING",label:"Tufting",icon:"fa-person"},
    {key:"CARVING",label:"Carving",icon:"fa-scissors"},
    {key:"FERTIG",label:"Fertig",icon:"fa-flag-checkered"},
    {key:"SHIPPED",label:"Versand",icon:"fa-truck"}
  ];
  const money=new Intl.NumberFormat(CFG.LOCALE||"de-DE",{style:"currency",currency:CFG.CURRENCY||"EUR"});
  const token=new URLSearchParams(location.search).get("token");
  let sb,lastJson="";
  document.addEventListener("DOMContentLoaded",init);
  async function init(){document.getElementById("close").onclick=closeModal;document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal();};if(!token||!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes("YOUR_")){fail();return;}sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);await load();setInterval(load,Math.max(5,Number(CFG.TRACKING_REFRESH_SECONDS||15))*1000);}
  async function load(){const {data,error}=await sb.rpc("get_cuffi_tracking",{p_token:token});if(error||!data){fail();return;}const json=JSON.stringify(data);if(json!==lastJson){lastJson=json;render(data);}}
  function fail(){document.getElementById("loading").style.display="none";document.getElementById("content").style.display="none";document.getElementById("error").style.display="grid";}
  function render(o){document.getElementById("loading").style.display="none";document.getElementById("error").style.display="none";const content=document.getElementById("content");content.style.display="block";const idx=STAGES.findIndex(s=>s.key===o.status),historyMap=new Map((o.history||[]).map(h=>[h.status,h.changed_at])),waText=encodeURIComponent(`Hallo, ich habe eine Frage zu meiner Bestellung ${o.invoice_no}.`),wa=`https://wa.me/${CFG.WHATSAPP_NUMBER}?text=${waText}`;content.innerHTML=`<section class="card"><div class="order-head"><div><div class="eyebrow">DEINE BESTELLUNG</div><div class="invoice">${esc(o.invoice_no)}</div></div><span class="status ${o.status}">${label(o.status)}</span></div><div class="overview"><img class="product-img" src="${esc(o.product_image_url||'logo.png')}" alt="${esc(o.product_name)}"><div class="details"><strong>Kunde:</strong><span>${esc(o.client_name)}</span><strong>Produkt:</strong><span>${esc(o.product_name)}</span><strong>Format:</strong><span>${esc(o.dimensions||'—')}</span><strong>Gesamtpreis:</strong><span>${money.format(Number(o.total_price||0))}</span><strong>Anzahlung:</strong><span class="price-good">${money.format(Number(o.deposit||0))}</span><strong>Restbetrag:</strong><span class="price-open">${money.format(Number(o.remaining||0))}</span></div><div class="side-actions"><div class="qr-placeholder"><i class="fa-solid fa-mobile-screen-button" style="font-size:28px"></i><span>Du hast den QR-Link erfolgreich geöffnet.</span></div><a class="btn btn-whatsapp" href="${wa}" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a><button class="btn btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> Als PDF speichern</button></div></div></section><section class="card"><h2 class="section-title">DEIN <span>AUFTRAGSFORTSCHRITT</span></h2><div class="steps">${STAGES.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}"><div class="bubble"><i class="fa-solid ${i<idx?'fa-check':s.icon}"></i></div><div class="step-name">${s.label}</div><div class="step-date">${historyMap.has(s.key)?formatDateTime(historyMap.get(s.key)):i===idx?'In Arbeit':'—'}</div></div>`).join('')}</div></section><section class="card"><h2 class="section-title">FORTSCHRITTSFOTOS</h2><div class="photos">${(o.photos||[]).length?(o.photos||[]).map(p=>`<div class="photo" data-image="${esc(p.image_url)}"><img src="${esc(p.image_url)}" alt=""><div class="photo-info"><strong>${esc(p.caption||label(p.stage))}</strong><p>${formatDateTime(p.created_at)}</p></div></div>`).join(''):'<div class="empty">Noch keine Fortschrittsfotos. Sobald das Studio Fotos hinzufügt, erscheinen sie hier.</div>'}</div></section><footer class="footer"><div>Letztes Update: ${formatDateTime(o.updated_at)}</div><div>Bei Fragen? <a href="${wa}" target="_blank">Schreib uns auf WhatsApp! <i class="fa-brands fa-whatsapp"></i></a></div></footer>`;document.querySelectorAll("[data-image]").forEach(x=>x.onclick=()=>openModal(x.dataset.image));}
  function openModal(src){document.getElementById("modalImg").src=src;document.getElementById("modal").classList.add("show");}function closeModal(){document.getElementById("modal").classList.remove("show");}
  function label(k){return STAGES.find(s=>s.key===k)?.label||k;}function formatDateTime(v){if(!v)return"—";return new Intl.DateTimeFormat("de-DE",{dateStyle:"short",timeStyle:"short"}).format(new Date(v));}function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
  </script>
</body>
</html>
